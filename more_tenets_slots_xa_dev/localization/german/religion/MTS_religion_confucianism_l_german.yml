 shangru_desc:0 "Älter als der Zhou-Konfuzianismus und somit orthodoxer. In Schildkrötenschalen geritzt, in Bronzegefäßen fließend. In Ritualfeuern brennend, in Schädeln dargebracht … der vergessene Bund zwischen Shangdi und den Ahnen."
