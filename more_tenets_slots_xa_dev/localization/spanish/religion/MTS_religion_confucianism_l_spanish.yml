 shangru_adherent:0 "confuciano Shang"
 shangru_adherent_plural:0 "confucianos Shang"
 shangru_desc:0 "Más antiguo que el rito confuciano Zhou, y por tanto más ortodoxo. Grabado en caparazones de tortuga, fluyendo en vasijas de bronce. Ardiendo en llamas rituales, ofrecido en cráneos… la alianza olvidada entre Shangdi y los ancestros."
