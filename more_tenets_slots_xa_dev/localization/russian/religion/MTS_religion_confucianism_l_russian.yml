 shangru:0 "Шанское конфуцианство"
 shangru_adj:0 "шанско-конфуцианский"
 shangru_adherent:0 "шанский конфуцианец"
 shangru_adherent_plural:0 "шанские конфуцианцы"
 shangru_desc:0 "Древнее конфуцианства Чжоу, а потому более ортодоксальное. Вырезано на черепашьих панцирях, струится в бронзовых сосудах. Пылает в ритуальном огне, возносится в черепах… забытый завет между Шанди и предками."
