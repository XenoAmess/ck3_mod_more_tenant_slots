 shangru:0 "Confucianisme des Shang"
 shangru_adj:0 "confucéen des Shang"
 shangru_adherent:0 "confucéen des Shang"
 shangru_adherent_plural:0 "confucéens des Shang"
 shangru_desc:0 "Plus ancien que le confucianisme des Zhou, et donc plus orthodoxe. Gravé dans des carapaces de tortue, coulant dans des vases de bronze. Brûlant dans des flammes rituelles, offert dans des crânes… L’alliance oubliée entre Shangdi et les ancêtres."
