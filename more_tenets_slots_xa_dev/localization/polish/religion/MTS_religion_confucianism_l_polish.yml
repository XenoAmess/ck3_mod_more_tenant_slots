l_polish:
 shangru:0 "Konfucjanizm Shang"
 shangru_adj:0 "konfucjański Shang"
 shangru_adherent:0 "wyznawca konfucjanizmu Shang"
 shangru_adherent_plural:0 "wyznawcy konfucjanizmu Shang"
 shangru_desc:0 "Starszy i przez to bardziej prawowierny niż konfucjanizm Zhou. Wyryty na skorupach żółwi, płynący w brązowych naczyniach. Płonący w ofiarnych ogniach, składany w czaszkach… Zapomniane przymierze między Shangdi a przodkami."
